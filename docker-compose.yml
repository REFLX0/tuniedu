version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tuniedu-postgres
    restart: always
    environment:
      POSTGRES_USER: tuniedu_user
      POSTGRES_PASSWORD: tuniedu_password_2026
      POSTGRES_DB: tuniedu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuniedu_user -d tuniedu_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tuniedu-network

  redis:
    image: redis:7-alpine
    container_name: tuniedu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tuniedu-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: tuniedu-storage
    restart: always
    environment:
      MINIO_ROOT_USER: tuniedu_admin
      MINIO_ROOT_PASSWORD: tuniedu_secure_storage_2026
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tuniedu-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
  livekit:
    image: livekit/livekit-server:latest
    container_name: tuniedu-livekit
    restart: always
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - tuniedu-network

  livekit-egress:
    image: livekit/egress:latest
    container_name: tuniedu-livekit-egress
    restart: always
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./docker/egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    depends_on:
      - livekit
      - redis
      - minio
    networks:
      - tuniedu-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  tuniedu-network:
    driver: bridge
