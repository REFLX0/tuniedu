name: TuniEdu CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Security Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Security Acceptance Tests (SEC-01 to SEC-26)
        run: npm run test:security

      - name: Run Webhook Signature Regression Tests
        run: npm run test:webhook

      - name: Run Fail-Closed Session Regression Tests
        run: npm run test:auth-session

      - name: Build Web Application
        run: npm run build
